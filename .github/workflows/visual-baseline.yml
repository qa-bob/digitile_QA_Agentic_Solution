name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for updating baselines (required for audit trail)'
        required: true
        type: string

jobs:
  update-baselines:
    name: Capture Visual Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Update visual baselines
        run: npm run baseline
        env:
          CI: true

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add __snapshots__/
          git diff --staged --quiet || git commit -m "chore: update visual regression baselines

          Reason: ${{ github.event.inputs.reason }}
          Triggered by: ${{ github.actor }}
          Run: ${{ github.run_id }}"
          git push

      - name: Upload baseline screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: __snapshots__/
          retention-days: 30
